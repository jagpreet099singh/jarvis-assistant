
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:#eaf5ff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;flex-direction:column;
}
header{
 padding:22px;text-align:center;
 border-bottom:1px solid #172b40;
}
h1{letter-spacing:8px;color:#55caff;margin:8px}
header p{color:#8199ad;font-size:12px}
main{
 width:100%;max-width:650px;margin:auto;
 padding:20px;flex:1;display:flex;
 flex-direction:column;gap:20px;
}
.orb{
 width:135px;height:135px;border-radius:50%;
 margin:25px auto 5px;
 border:2px solid #38bdf8;
 box-shadow:0 0 25px #168acb, inset 0 0 25px #168acb;
 display:grid;place-items:center;
 color:#72d8ff;font-size:38px;
}
.status{text-align:center;color:#65c9ff;font-size:13px}
#chat{
 flex:1;min-height:180px;max-height:42vh;
 overflow-y:auto;display:flex;flex-direction:column;gap:12px;
}
.message{
 padding:13px 16px;border-radius:14px;
 max-width:88%;line-height:1.5;font-size:14px;
}
.bot{background:#12243a;align-self:flex-start}
.user{background:#075985;align-self:flex-end}
.controls{display:flex;gap:9px}
input{
 flex:1;min-width:0;background:#101d2c;
 border:1px solid #29435d;border-radius:12px;
 color:white;padding:14px;font-size:14px;
}
button{
 border:0;border-radius:12px;padding:13px;
 background:#087eae;color:white;font-weight:bold;
}
button:active{opacity:.7}
.mic{background:#153b58}
footer{text-align:center;color:#62798c;font-size:11px;padding:18px}
</style>
</head>
<body>
<header>
 <h1>JARVIS</h1>
 <p>PERSONAL AI ASSISTANT</p>
</header>

<main>
 <div class="orb">✦</div>
 <div class="status" id="status">SYSTEM ONLINE · INTERFACE READY</div>

 <div id="chat">
  <div class="message bot">
   Hello! I am Jarvis. My interface is ready.
   My AI connection is not configured yet.
  </div>
 </div>

 <div class="controls">
  <input id="input" placeholder="Talk to Jarvis..." />
  <button onclick="send()">SEND</button>
  <button class="mic" onclick="listen()">🎙</button>
 </div>
</main>

<footer>JARVIS · PERSONAL PROJECT</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const statusText=document.getElementById("status");

function message(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function send(){
 const text=input.value.trim();
 if(!text)return;
 message(text,"user");
 input.value="";
 message("Your message has been received. The cloud AI brain will be connected in the next development step.","bot");
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});

function listen(){
 const SpeechRecognition=
 window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  statusText.textContent="VOICE INPUT NOT SUPPORTED IN THIS BROWSER";
  return;
 }

 const recognition=new SpeechRecognition();
 recognition.lang="en-IN";
 recognition.onstart=()=>{
  statusText.textContent="LISTENING...";
 };
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  statusText.textContent="VOICE RECEIVED";
  send();
 };
 recognition.onerror=()=>{
  statusText.textContent="VOICE INPUT ERROR";
 };
 recognition.onend=()=>{
  if(statusText.textContent==="LISTENING...")
   statusText.textContent="SYSTEM ONLINE";
 };
 recognition.start();
}

// JARVIS - SUPABASE CONNECTION

const JARVIS_SUPABASE_URL = "https://dgckoxzkjcghiegghhup.supabase.co"
// JARVIS - EMAIL AUTHENTICATION

(function initializeJarvisAuth() {
    let attempts = 0;

    const waitForSupabase = setInterval(() => {
        attempts++;

        if (!window.jarvisSupabase) {
            if (attempts >= 100) {
                clearInterval(waitForSupabase);
                console.error("Jarvis: Supabase connection not found.");
            }
            return;
        }

        clearInterval(waitForSupabase);

        const supabase = window.jarvisSupabase;

        const authBox = document.createElement("div");

        authBox.id = "jarvis-auth";
        authBox.style.cssText = `
            max-width: 360px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 12px;
            background: #171717;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        

        authBox.innerHTML = 
            <h2>JARVIS LOGIN</h2>

            <input
                id="jarvis-email"
                type="email"
                placeholder="Email address"
                autocomplete="email"
                style="width:90%;padding:12px;margin:8px 0;"
            >

            <input
                id="jarvis-password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                style="width:90%;padding:12px;margin:8px 0;"
            >

            <button id="jarvis-signup"
                style="padding:12px;margin:6px;">
                Create Account
            </button>

            <button id="jarvis-login"
                style="padding:12px;margin:6px;">
                Login
            </button>

            <button id="jarvis-logout"
                style="padding:12px;margin:6px;display:none;">
                Logout
            </button>

            <p id="jarvis-auth-status">
                Sign in or create an account.
            </p>
        `;

        document.body.prepend(authBox);

        const emailInput = document.getElementById("jarvis-email");
        const passwordInput = document.getElementById("jarvis-password");
        const status = document.getElementById("jarvis-auth-status");

        const signupButton = document.getElementById("jarvis-signup");
        const loginButton = document.getElementById("jarvis-login");
        const logoutButton = document.getElementById("jarvis-logout");

        function showStatus(message) {
            status.textContent = message;
        }

        function showSignedIn(user) {
            emailInput.style.display = "none";
            passwordInput.style.display = "none";
            signupButton.style.display = "none";
            loginButton.style.display = "none";
            logoutButton.style.display = "inline-block";

            showStatus("Signed in as " + user.email);
        }

        function showSignedOut() {
            emailInput.style.display = "inline-block";
            passwordInput.style.display = "inline-block";
            signupButton.style.display = "inline-block";
            loginButton.style.display = "inline-block";
            logoutButton.style.display = "none";

            showStatus("Sign in or create an account.");
        }

        signupButton.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showStatus("Enter your email and password.");
                return;
            }

            showStatus("Creating your account...");

            const { data, error } = await supabase.auth.signUp({
                email,
                password
            });

            if (error) {
                showStatus(error.message);
                return;
            }

            if (data.session) {
                showSignedIn(data.user);
            } else {
                showStatus(
                    "Account created. Check your email if confirmation is required."
                );
            }
        });

        loginButton.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showStatus("Enter your email and password.");
                return;
            }

            showStatus("Signing in...");

            const { data, error } =
                await supabase.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) {
                showStatus(error.message);
                return;
            }

            showSignedIn(data.user);
        });

        logoutButton.addEventListener("click", async () => {
            const { error } = await supabase.auth.signOut();

            if (error) {
                showStatus(error.message);
                return;
            }

            showSignedOut();
        });

        supabase.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                showSignedIn(session.user);
            } else {
                showSignedOut();
            }
        });

        showStatus("Checking your account...");

    }, 100);
})();


const JARVIS_SUPABASE_KEY = "sb_publishable_F944js26x6rQh9Z5idf5tQ_qiU1sZPi";

const loadSupabase = document.createElement("script");

loadSupabase.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

loadSupabase.onload = () => {
    window.jarvisSupabase = window.supabase.createClient(
        JARVIS_SUPABASE_URL,
        JARVIS_SUPABASE_KEY
    );

    console.log("JARVIS SUPABASE CONNECTED");
};

loadSupabase.onerror = () => {
    console.error("JARVIS SUPABASE FAILED TO LOAD");
};

document.head.appendChild(loadSupabase);
</script>
</body>
</html>
